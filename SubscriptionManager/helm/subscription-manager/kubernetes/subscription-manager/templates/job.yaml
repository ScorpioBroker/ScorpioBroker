---
apiVersion: batch/v1
kind: Job
metadata:
  name: subscription-manager-flyway-init
spec:
  completionMode: NonIndexed
  template:
    metadata: {}
    spec:
      containers:
        - env:
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "true"
            - name: QUARKUS_INIT_AND_EXIT
              value: "true"
          image: scorpiobroker/subscription-manager:java-latest
          name: subscription-manager-flyway-init
      restartPolicy: OnFailure
      serviceAccountName: subscription-manager
