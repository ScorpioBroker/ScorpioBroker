quarkus.application.name=commons
quarkus.http.port=9090
quarkus.log.level=INFO
quarkus.log.category."org.apache.kafka".level=ERROR
quarkus.ssl.native=true
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.lang3.RandomStringUtils
scorpio.postgres.host=${dbhost:localhost}
scorpio.postgres.port=${dbport:5432}
scorpio.postgres.username=${dbuser:ngb}
scorpio.postgres.password=${dbpass:ngb}
scorpio.postgres.database-name=${dbname:ngb}
scorpio.gateway.url=${gateway:http://localhost:9090}
scorpio.postgres.jdbcurl=jdbc:postgresql://${scorpio.postgres.host}:${scorpio.postgres.port}/${scorpio.postgres.database-name}?ApplicationName=${quarkus.application.name}
scorpio.messaging.duplicate=true
scorpio.entitymanager.url=http://localhost:9090
scorpio.atcontexturl=http://at-context-server:2023
#Database settings
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.driver=org.postgresql.Driver
quarkus.datasource.username=${scorpio.postgres.username}
quarkus.datasource.password=${scorpio.postgres.password}
quarkus.datasource.jdbc.url=${scorpio.postgres.jdbcurl}
quarkus.datasource.reactive.shared=true
quarkus.datasource.reactive.url=postgresql://${scorpio.postgres.host}:${scorpio.postgres.port}/${scorpio.postgres.database-name}
#quarkus.datasource.reactive.name=blabliblub
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
pool.minsize=5
pool.maxsize=20
pool.initialSize=10
#VISIBILITY BLOCK ###########
scorpio.ngsild.corecontext=https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context-v1.8.jsonld
