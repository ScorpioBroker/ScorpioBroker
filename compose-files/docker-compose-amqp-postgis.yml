version: '3'

services:
  artemis:
    image: quay.io/artemiscloud/activemq-artemis-broker:1.0.26
    ports:
     - "5672:5672"
     - "8161:8161"
    environment:
      AMQ_USER: guest
      AMQ_PASSWORD: guest
  postgres:
    image: postgis/postgis
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
    depends_on:
      - artemis