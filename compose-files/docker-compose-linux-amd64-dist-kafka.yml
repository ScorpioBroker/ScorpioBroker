version: '3'

services:
  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092"
    environment:
      # KRaft settings
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # Listener configuration
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Log retention settings
      KAFKA_LOG_RETENTION_MS: 10000
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000

      # Single broker configuration - CRITICAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Cluster ID (required for KRaft)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    logging:
      driver: none
  postgres:
    image: postgis/postgis
    ports:
      - "5432"
    environment:
      POSTGRES_USER: ngb
      POSTGRES_PASSWORD: ngb
      POSTGRES_DB: ngb
  emgr:
    image: scorpiobroker/entity-manager:linux-amd64-kafka-latest
    environment:
      DBHOST: postgres
      BUSHOST: kafka
      QUARKUS_EUREKA_SERVICE-URL_DEFAULT: "http://eureka:8761/eureka"
    ports:
      - "1025:1025"
    depends_on:
      - kafka
  histmgr:
    image: scorpiobroker/history-manager:linux-amd64-kafka-latest
    environment:
      DBHOST: postgres
      BUSHOST: kafka
      QUARKUS_EUREKA_SERVICE-URL_DEFAULT: "http://eureka:8761/eureka"
    ports:
      - "1040:1040"
    depends_on:
      - kafka
  qrymgr:
    image: scorpiobroker/query-manager:linux-amd64-kafka-latest
    environment:
      DBHOST: postgres
      BUSHOST: kafka
      QUARKUS_EUREKA_SERVICE-URL_DEFAULT: "http://eureka:8761/eureka"
    ports:
      - "1026:1026"
    depends_on:
      - kafka
      - postgres
  regmgr:
    image: scorpiobroker/registry-manager:linux-amd64-kafka-latest
    environment:
      DBHOST: postgres
      BUSHOST: kafka
      QUARKUS_EUREKA_SERVICE-URL_DEFAULT: "http://eureka:8761/eureka"
    ports:
      - "1030:1030"
    depends_on:
      - kafka
      - postgres
  regsbsmgr:
    image: scorpiobroker/registry-subscription-manager:linux-amd64-kafka-latest
    environment:
      DBHOST: postgres
      BUSHOST: kafka
      QUARKUS_EUREKA_SERVICE-URL_DEFAULT: "http://eureka:8761/eureka"
    ports:
      - "2025:2025"
    depends_on:
      - kafka
      - postgres
  sbsmgr:
    image: scorpiobroker/subscription-manager:linux-amd64-kafka-latest
    environment:
      DBHOST: postgres
      BUSHOST: kafka
      QUARKUS_EUREKA_SERVICE-URL_DEFAULT: "http://eureka:8761/eureka"
    ports:
      - "2026:2026"
    depends_on:
      - kafka
