scorpio.messageconnection.bootstrap.host=${bushost:localhost}
scorpio.messageconnection.bootstrap.port=${busport:61616}
bootstrap.servers=${scorpio.messageconnection.bootstrap.host}:${scorpio.messageconnection.bootstrap.port}
scorpio.messageconnection.protocol=activemq
scorpio.messageconnection.options=
camel.component.activemq.broker-url=${bootstrap.servers}
scorpio.messaging.maxSize=1048576
mp.messaging.incoming.registryretrieve.connector=smallrye-camel
mp.messaging.incoming.registryretrieve.endpoint-uri=${scorpio.messageconnection.protocol}:${scorpio.topics.registry}${scorpio.messageconnection.options}
mp.messaging.incoming.registryretrieve.auto.offset.reset=latest
mp.messaging.incoming.registryretrieve.broadcast=true
#readability block###########
mp.messaging.outgoing.entity.endpoint-uri=${scorpio.messageconnection.protocol}:${scorpio.topics.entity}${scorpio.messageconnection.options}
mp.messaging.outgoing.entity.connector=smallrye-camel
