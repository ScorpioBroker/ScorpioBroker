#scorpio.messageconnection.bootstrap.host=${bushost:localhost}
#scorpio.messageconnection.bootstrap.port=${busport:5672}
#bootstrap.servers=${scorpio.messageconnection.bootstrap.host}:${scorpio.messageconnection.bootstrap.port}
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.lang3.RandomStringUtils
#camel.component.aws2-sqs.maximum-message-size=10485760
scorpio.messageconnection.protocol=sns-fanout
scorpio.messageconnection.options=?greedy=true&delay=20
#?addresses=localhost:5672
scorpio.messaging.maxSize=262144
mp.messaging.incoming.registryretrieve.connector=smallrye-camel
mp.messaging.incoming.registryretrieve.endpoint-uri=${scorpio.messageconnection.protocol}:${scorpio.topics.registry}${scorpio.messageconnection.options}
mp.messaging.incoming.registryretrieve.auto.offset.reset=latest
mp.messaging.incoming.registryretrieve.broadcast=true
#readability block###########
mp.messaging.incoming.entityretrieve.connector=smallrye-camel
mp.messaging.incoming.entityretrieve.endpoint-uri=${scorpio.messageconnection.protocol}:${scorpio.topics.entity}${scorpio.messageconnection.options}
mp.messaging.incoming.entityretrieve.auto.offset.reset=latest
mp.messaging.incoming.entityretrieve.broadcast=true
#readability block###########
mp.messaging.outgoing.histsync.connector=smallrye-camel
mp.messaging.outgoing.histsync.endpoint-uri=${scorpio.messageconnection.protocol}:${scorpio.topics.histsync}${scorpio.messageconnection.options}
mp.messaging.incoming.histsyncretrieve.connector=smallrye-camel
mp.messaging.incoming.histsyncretrieve.endpoint-uri=${scorpio.messageconnection.protocol}:${scorpio.topics.histsync}${scorpio.messageconnection.options}
mp.messaging.incoming.histsyncretrieve.auto.offset.reset=latest
