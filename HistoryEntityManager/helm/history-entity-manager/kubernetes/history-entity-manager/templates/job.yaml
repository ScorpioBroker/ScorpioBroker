---
apiVersion: batch/v1
kind: Job
metadata:
  name: history-entity-manager-flyway-init
spec:
  completionMode: NonIndexed
  template:
    metadata: {}
    spec:
      containers:
        - env:
            - name: QUARKUS_INIT_AND_EXIT
              value: "true"
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "true"
          image: docker.io/hebgen/history-entity-manager:6.0.1-SNAPSHOT
          name: history-entity-manager-flyway-init
      restartPolicy: OnFailure
      serviceAccountName: history-entity-manager
