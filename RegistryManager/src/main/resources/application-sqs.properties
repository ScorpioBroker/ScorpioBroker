#scorpio.messageconnection.bootstrap.port=${busport:5672}
#bootstrap.servers=${scorpio.messageconnection.bootstrap.host}:${scorpio.messageconnection.bootstrap.port}
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.lang3.RandomStringUtils
#camel.component.aws2-sqs.maximum-message-size=10485760
scorpio.messageconnection.protocol=sns-fanout
scorpio.messageconnection.options=?greedy=true&delay=20
#?addresses=localhost:5672
scorpio.messaging.maxSize=262144
mp.messaging.outgoing.registry.endpoint-uri=${scorpio.messageconnection.protocol}:${scorpio.topics.registry}${scorpio.messageconnection.options}
mp.messaging.outgoing.registry.connector=smallrye-camel
