---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.28.4
    app.quarkus.io/commit-id: 59675831de0ce7a6ee91ff20efd25a8e6581e7a9
    app.quarkus.io/vcs-uri: https://github.com/scorpiobroker/scorpiobroker.git
    app.quarkus.io/build-timestamp: 2026-06-24 - 13:54:10 +0000
    prometheus.io/scrape: "true"
    prometheus.io/path: /q/metrics
    prometheus.io/port: "10096"
    prometheus.io/scheme: http
  labels:
    app.kubernetes.io/name: history-query-manager
    app.kubernetes.io/version: 6.0.1-SNAPSHOT
    app.kubernetes.io/managed-by: quarkus
  name: history-query-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/version: 6.0.1-SNAPSHOT
      app.kubernetes.io/name: history-query-manager
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.28.4
        app.quarkus.io/commit-id: 59675831de0ce7a6ee91ff20efd25a8e6581e7a9
        app.quarkus.io/vcs-uri: https://github.com/scorpiobroker/scorpiobroker.git
        app.quarkus.io/build-timestamp: 2026-06-24 - 13:54:10 +0000
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "10096"
        prometheus.io/scheme: http
      labels:
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/version: 6.0.1-SNAPSHOT
        app.kubernetes.io/name: history-query-manager
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: gateway
              value: http://localhost:9090
            - name: dbport
              value: "5432"
            - name: dbuser
              value: ngb
            - name: dbpass
              value: ngb
            - name: dbname
              value: ngb
            - name: dbhost
              value: localhost
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "false"
          image: docker.io/hebgen/history-query-manager:6.0.1-SNAPSHOT
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/live
              port: 10096
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          name: history-query-manager
          ports:
            - containerPort: 10096
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/ready
              port: 10096
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          startupProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/started
              port: 10096
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
      initContainers:
        - args:
            - job
            - history-query-manager-flyway-init
          image: groundnuty/k8s-wait-for:no-root-v1.7
          imagePullPolicy: Always
          name: wait-for-flyway
      serviceAccountName: history-query-manager
---
apiVersion: batch/v1
kind: Job
metadata:
  name: history-query-manager-flyway-init
spec:
  completionMode: NonIndexed
  template:
    metadata: {}
    spec:
      containers:
        - env:
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "true"
            - name: QUARKUS_INIT_AND_EXIT
              value: "true"
          image: docker.io/hebgen/history-query-manager:6.0.1-SNAPSHOT
          name: history-query-manager-flyway-init
      restartPolicy: OnFailure
      serviceAccountName: history-query-manager
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.28.4
    app.quarkus.io/commit-id: 59675831de0ce7a6ee91ff20efd25a8e6581e7a9
    app.quarkus.io/vcs-uri: https://github.com/scorpiobroker/scorpiobroker.git
    app.quarkus.io/build-timestamp: 2026-06-24 - 13:54:10 +0000
  labels:
    app.kubernetes.io/name: history-query-manager
    app.kubernetes.io/version: 6.0.1-SNAPSHOT
    app.kubernetes.io/managed-by: quarkus
  name: history-query-manager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: history-query-manager
      app.kubernetes.io/version: 6.0.1-SNAPSHOT
  endpoints:
    - scheme: http
      targetPort: 10096
      path: /q/metrics
      interval: 10s
      honorLabels: true
