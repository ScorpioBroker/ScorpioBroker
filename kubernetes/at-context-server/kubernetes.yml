    app.kubernetes.io/version: 6.0.2-SNAPSHOT
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.28.4
    app.quarkus.io/commit-id: acb7e4bc4d7b4e31bfa3872b87af3146ff9306ef
    app.quarkus.io/vcs-uri: https://github.com/scorpiobroker/scorpiobroker.git
    app.quarkus.io/build-timestamp: 2026-07-18 - 19:35:01 +0000
    prometheus.io/scrape: "true"
    prometheus.io/path: /q/metrics
    prometheus.io/port: "10097"
    prometheus.io/scheme: http
  labels:
    app.kubernetes.io/name: at-context-server
    app.kubernetes.io/version: 6.0.2-SNAPSHOT
    app.kubernetes.io/managed-by: quarkus
  name: at-context-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: at-context-server
      app.kubernetes.io/version: 6.0.2-SNAPSHOT
  template:
    metadata:
      annotations:
        app.quarkus.io/quarkus-version: 3.28.4
        app.quarkus.io/commit-id: acb7e4bc4d7b4e31bfa3872b87af3146ff9306ef
        app.quarkus.io/vcs-uri: https://github.com/scorpiobroker/scorpiobroker.git
        app.quarkus.io/build-timestamp: 2026-07-18 - 19:35:01 +0000
        prometheus.io/scrape: "true"
        prometheus.io/path: /q/metrics
        prometheus.io/port: "10097"
        prometheus.io/scheme: http
      labels:
        app.kubernetes.io/managed-by: quarkus
        app.kubernetes.io/name: at-context-server
        app.kubernetes.io/version: 6.0.2-SNAPSHOT
    spec:
      containers:
        - env:
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "false"
          image: scorpiobroker/info-manager:java-latest
          imagePullPolicy: Always
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/live
              port: 10097
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          name: at-context-server
          ports:
            - containerPort: 10097
              name: http
              protocol: TCP
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/ready
              port: 10097
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          startupProbe:
            failureThreshold: 3
            httpGet:
              path: /q/health/started
              port: 10097
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
      initContainers:
        - args:
            - job
            - at-context-server-flyway-init
          image: groundnuty/k8s-wait-for:no-root-v1.7
          imagePullPolicy: Always
          name: wait-for-flyway
      serviceAccountName: at-context-server
---
apiVersion: batch/v1
kind: Job
metadata:
  name: at-context-server-flyway-init
spec:
  completionMode: NonIndexed
  template:
    metadata: {}
    spec:
      containers:
        - env:
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "true"
            - name: QUARKUS_INIT_AND_EXIT
              value: "true"
          image: scorpiobroker/info-manager:java-latest
          name: at-context-server-flyway-init
      restartPolicy: OnFailure
      serviceAccountName: at-context-server
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations:
    app.quarkus.io/quarkus-version: 3.28.4
    app.quarkus.io/commit-id: acb7e4bc4d7b4e31bfa3872b87af3146ff9306ef
    app.quarkus.io/vcs-uri: https://github.com/scorpiobroker/scorpiobroker.git
    app.quarkus.io/build-timestamp: 2026-07-18 - 19:35:01 +0000
  labels:
    app.kubernetes.io/name: at-context-server
    app.kubernetes.io/version: 6.0.2-SNAPSHOT
    app.kubernetes.io/managed-by: quarkus
  name: at-context-server
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: at-context-server
      app.kubernetes.io/version: 6.0.2-SNAPSHOT
  endpoints:
    - scheme: http
      targetPort: 10097
      path: /q/metrics
      interval: 10s
      honorLabels: true
