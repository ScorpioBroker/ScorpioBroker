---
apiVersion: batch/v1
kind: Job
metadata:
  name: query-manager-flyway-init
spec:
  completionMode: NonIndexed
  template:
    metadata: {}
    spec:
      containers:
        - env:
            - name: QUARKUS_FLYWAY_ACTIVE
              value: "true"
            - name: QUARKUS_INIT_AND_EXIT
              value: "true"
          image: scorpiobroker/query-manager:java-latest
          name: query-manager-flyway-init
      restartPolicy: OnFailure
      serviceAccountName: query-manager
